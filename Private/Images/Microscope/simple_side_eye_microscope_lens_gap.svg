<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <radialGradient id="lens" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#dfffff"/>
      <stop offset="55%" stop-color="#39cfe8"/>
      <stop offset="100%" stop-color="#073044"/>
    </radialGradient>

    <linearGradient id="metal" x1="140" y1="72" x2="210" y2="168">
      <stop offset="0%" stop-color="#eef3f5"/>
      <stop offset="50%" stop-color="#7f8b92"/>
      <stop offset="100%" stop-color="#20272c"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="28" fill="#05070a"/>

  <!-- simplified side-view eye pulled back -->
  <path d="M28 120
           C48 98, 74 94, 98 120
           C74 146, 48 142, 28 120 Z"
        fill="#eefcff"
        stroke="#78f2ff"
        stroke-width="5"
        stroke-linejoin="round"/>

  <!-- iris -->
  <ellipse cx="79" cy="120" rx="10" ry="16" fill="#19c7e8"/>
  <ellipse cx="82" cy="120" rx="4" ry="10" fill="#02080a"/>
  <circle cx="76" cy="113" r="2.5" fill="#ffffff"/>

  <!-- upper eyelid -->
  <path d="M42 107 C60 95, 79 98, 97 118"
        fill="none"
        stroke="#78f2ff"
        stroke-width="4"
        stroke-linecap="round"
        opacity="0.8"/>

  <!-- clear air gap between eye and lens -->
  <line x1="110" y1="120" x2="124" y2="120"
        stroke="#66eaff"
        stroke-width="2"
        stroke-dasharray="3 5"
        opacity="0.5"/>

  <!-- microscope eyepiece -->
  <rect x="132" y="88" width="60" height="64" rx="16"
        fill="url(#metal)"
        stroke="#dce8ec"
        stroke-width="5"/>

  <circle cx="132" cy="120" r="30"
          fill="#121b20"
          stroke="#dce8ec"
          stroke-width="5"/>

  <circle cx="132" cy="120" r="20"
          fill="url(#lens)"
          stroke="#5ff5ff"
          stroke-width="3"/>

  <!-- microscope tube -->
  <path d="M192 120 H220"
        stroke="#8b969c"
        stroke-width="16"
        stroke-linecap="round"/>

  <!-- subtle outer ring -->
  <circle cx="120" cy="120" r="108"
          fill="none"
          stroke="#1ddfff"
          stroke-width="2"
          opacity="0.3"/>
</svg>